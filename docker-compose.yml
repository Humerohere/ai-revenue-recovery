services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arr
      POSTGRES_PASSWORD: arr
      POSTGRES_DB: arr
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arr"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://arr:arr@db:5432/arr
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/srv/app
      - ./backend/alembic:/srv/alembic
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://arr:arr@db:5432/arr
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes: ["./backend/app:/srv/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
